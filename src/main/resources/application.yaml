server:
  port: 8082

spring:
  application:
    name: "Tracker-task"

  datasource:
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

internal:
  api-key: ${INTERNAL_API_KEY}
  header-name: ${INTERNAL_NAME_HEADER}